name : "CollisionEnv"
width : 128
height : 128
max_steps : 100
ssaa_scale : 3
render_scale : 2
agent_shape : "disk"

# Physical Properties
agent_mass : 1.0
light_mass : 0.5
heavy_mass : 2.5
elasticity : 0.85
linear_drag : 0.15
max_drive_force : 5.0
dt : 0.1

# Fracture / Shatter Thresholds (Impact Force = Impulse / dt)
shatter_force_light : 4.0
shatter_force_heavy : 10.0

# Destination & Geometry
goal_radius : 12.0
reach_margin : 3.0

# Rewards
shatter_penalty : 5.0
success_reward : 10.0
step_penalty : 0.05
progress_reward_coeff : 1.0

verbose : true
observation_mode : "feature"
task_mode : "target"
mission : ???
mode : "train"
fps : 5
total_timestep : 200000
