  - models: text_conditioned_vae_cnn_MiniWorld
  - env: MiniWorld

agent_name : DQN
dqn_model_dir : model_weights/{env}/PPO/seed_123/{agent_name}.zip #"model_weights/DQN/2025-12-12_19-08-44_7FLPAL/DQN.zip"
vae_model_dir:  model_weights/{env}/VAE_1D_no_text_disc/seed_123/VAE_1D_no_text_disc.tar
result_dir: result
mode: transfer
mapping_strategy: "llm" # options: "llm", "retrieval"
querry_mode: nvidia # Querry mode for LLM. options openrouter/huggingface
llm_model: "nvidia/nemotron-3-ultra-550b-a55b"  #"qwen/qwen3.6-plus:free", meta-llama/llama-3.3-70b-instruct:free, model_weights/FineTunedGemma/final, Qwen/Qwen3.8-27B, google/gemma-4-12B-it, nvidia/nemotron-3-ultra-550b-a55b
