defaults:
  - _self_

hydra:
  job:
    chdir: false

paths:
  source_dir: "data/Variable_data_MiniWorld"
  output_dir: "data/Qualitative_data_MiniWorld"
  link_mode: "symlink" # "symlink" (instant, zero disk) or "copy"

model:
  model_id: "google/gemma-4-12B-it"
  dtype: "bfloat16"
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 96
  batch_size: 16

options:
  limit: null # Set to an integer (e.g. 50) for testing, or null for all 150k
  log_interval: 100
