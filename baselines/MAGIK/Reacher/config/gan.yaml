General:
  env : reacher
  datapath : data
  human_label_ratio : 0.005

Network:
  y_dim : 4
  batch_size : 10000
  epochs : 1000
  save_freequency : 100
  input_dim : 15
  hidden_dim : 128
  latent_dim : 10
  decoder_hidden_dims : [256,128]
  lambda_disentangle : 0.10
  aux_reconstruction_loss_weight : 0.10
  discriminator_lr : 0.0002
  aux_classifier_lr : 0.0002
  encoder_lr : 0.0002
  mapper_hidden_layers : [512, 256, 128]
  lambda_identity : 5.0    # Strong identity preservation
  lambda_class : 10.0      # Prioritize classification
  lambda_sim : 1.0         # Relax similarity initially
  lambda_cycle : 5.0       # Optional cycle consistency

Test:
  gan_checkpoint : "models/reacher/gan/2025-04-08_14-15-07_TPGHRX/model.pt"
  agent : "sac"
  agent_checkpoint : "model_weights/reacher/SAC/2025-04-05_12-43-17_ZKJBJH/sac_agent"